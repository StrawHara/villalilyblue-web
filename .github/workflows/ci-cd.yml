name: ci-cd
run-name: ${{ (github.event_name == 'pull_request' && 'CI') || 'CI + Deploy' }} — ${{ github.sha }}

# Même méthode que perrotvi.fr / blendi (runbook-cicd-ns3365007) : tout sur runners GitHub-hosted.
#   • quality : build + typecheck + lint — sur PR et push main. Pas de DB ici → pas de migrate.
#   • deploy  : image app-prod construite ici, envoyée au Hub, déployée par hub-deploy
#               (swap d'app-prod + santé + retour arrière). Aucun build sur le serveur.
# Le déploiement ne tourne que si la variable DEPLOY_ENABLED == 'true'.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint

  # Image construite ici et déployée sur le Hub par hub-deploy (décision hub-ci-images, 04/11/2026 ;
  # modèle straw-infra/ci/deploy-image.yml). Le Hub vérifie le commit, redémarre app-prod seul,
  # contrôle /fr et revient à la version précédente en cas d'échec.
  # Secrets : HUB_DEPLOY_KEY, HUB_HOST, HUB_KNOWN_HOSTS.
  deploy:
    name: Deploy (Hub)
    needs: quality
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    env:
      SERVICE: villalilyblue-web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_GA_ID est inliné dans le bundle au build : valeur publique reprise du .env du
      # Hub au 04/11/2026 (le build la lisait dans le .env copié par `COPY . .`, exclu désormais
      # par .dockerignore). Sans elle, le site part sans Google Analytics.
      - name: Build app-prod
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          tags: hub/${{ env.SERVICE }}-app-prod:${{ github.sha }}
          load: true
          build-args: |
            NEXT_PUBLIC_GA_ID=G-LE74ZXQJ68
          cache-from: type=gha,scope=app-prod
          cache-to: type=gha,mode=max,scope=app-prod

      - name: Send to Hub and deploy
        env:
          HUB_DEPLOY_KEY: ${{ secrets.HUB_DEPLOY_KEY }}
          HUB_HOST: ${{ secrets.HUB_HOST }}
          HUB_KNOWN_HOSTS: ${{ secrets.HUB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HUB_DEPLOY_KEY" > ~/.ssh/hub && chmod 600 ~/.ssh/hub
          printf '%s\n' "$HUB_KNOWN_HOSTS" > ~/.ssh/known_hosts
          images=$(docker image ls "hub/$SERVICE-*" --format '{{.Repository}}:{{.Tag}}' | grep ":$GITHUB_SHA$")
          echo "images : $images"
          # Fichier puis vérification : un docker save sur un tube peut sortir une archive tronquée.
          docker save -o /tmp/images.tar $images
          tar -tf /tmp/images.tar manifest.json >/dev/null
          zstd -T0 -3 -q /tmp/images.tar -o /tmp/images.tar.zst
          ssh -i ~/.ssh/hub -o IdentitiesOnly=yes -o BatchMode=yes "deploy@$HUB_HOST" deploy "$SERVICE" "$GITHUB_SHA" < /tmp/images.tar.zst
